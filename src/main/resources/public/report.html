<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item - Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Campus Lost & Found</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="browse.html">Browse Items</a></li>
                    <li><a href="report.html?type=LOST" id="nav-lost">Report Lost</a></li>
                    <li><a href="report.html?type=FOUND" id="nav-found">Report Found</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="card details-container">
            <h2 id="form-title">Report an Item</h2>
            <div id="message-box"></div>
            
            <form id="report-form">
                <div class="form-group">
                    <label for="type">Item Type</label>
                    <select id="type" name="type" class="form-control" required>
                        <option value="LOST">Lost Item</option>
                        <option value="FOUND">Found Item</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="name">Item Name</label>
                    <input type="text" id="name" name="name" class="form-control" required placeholder="e.g. Black Wallet">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" class="form-control" rows="4" required placeholder="Detailed description of the item..."></textarea>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" class="form-control" required placeholder="Where was it lost/found? (e.g. Central Library)">
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="contact">Contact Information</label>
                    <input type="email" id="contact" name="contact" class="form-control" required placeholder="student@example.com">
                </div>

                <div class="form-group">
                    <label for="photo">Item Photo (Optional)</label>
                    <input type="file" id="photo" name="photo" class="form-control" accept="image/png,image/jpeg,image/webp">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Submit Report</button>
            </form>
        </div>
    </main>

    <script>
        // Set date to today by default
        document.getElementById('date').valueAsDate = new Date();

        // Get URL parameter for type
        const urlParams = new URLSearchParams(window.location.search);
        const typeParam = urlParams.get('type');
        
        if (typeParam === 'FOUND') {
            document.getElementById('type').value = 'FOUND';
            document.getElementById('form-title').innerText = 'Report a Found Item';
            document.getElementById('nav-found').classList.add('active');
        } else {
            document.getElementById('type').value = 'LOST';
            document.getElementById('form-title').innerText = 'Report a Lost Item';
            document.getElementById('nav-lost').classList.add('active');
        }

        document.getElementById('report-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgBox = document.getElementById('message-box');
            msgBox.style.display = 'none';

            const form = document.getElementById('report-form');
            const formData = new FormData(form);
            const currentType = document.getElementById('type').value;

            try {
                const response = await fetch('/api/items', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    msgBox.className = 'msg-success';
                    msgBox.innerText = `Your ${currentType.toLowerCase()} item has been reported successfully.`;
                    msgBox.style.display = 'block';
                    form.reset();
                    document.getElementById('date').valueAsDate = new Date();
                    document.getElementById('type').value = currentType;
                } else {
                    const err = await response.json();
                    msgBox.className = 'msg-error';
                    msgBox.innerText = err.message || 'An error occurred while submitting.';
                    msgBox.style.display = 'block';
                }
            } catch (error) {
                msgBox.className = 'msg-error';
                msgBox.innerText = 'Network error. Please try again later.';
                msgBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
